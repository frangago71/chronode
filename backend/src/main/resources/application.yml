server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: chronode-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/chronode_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  threads:
    virtual:
      enabled: true

# Configuración de documentación OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
